	<meta property="og:type" content="website">
	<meta property="og:site_name" content="Train Diagram Maker">
	<meta property="og:title" content="資料庫 - Train Diagram Maker">
	<meta property="og:description" content="鐵道路線資料與運行圖資料庫，下載後直接匯入 Train Diagram Maker。">
	<meta property="og:locale" content="zh_TW">
	<link rel="stylesheet" type="text/css" href="../../bootstrap/css/bootstrap.min.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="../../program/ui/langSwitch.css">
	<link rel="stylesheet" type="text/css" href="../../program/ui/database.css">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container-fluid">
			<a class="navbar-brand" href="../index.html" style="color: white">線上運行圖製作</a>
			<div class="lang-switch ms-auto me-2 me-lg-0 order-lg-last"></div>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav">
					<li class="nav-item">
						<a class="nav-link" href="../diagram-maker.html">製作</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="../manual/manual-index.html">操作說明</a>
					</li>
					<li class="nav-item">
						<a class="nav-link active" aria-current="page" href="./">資料庫</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>

	<main class="db-layout">
		<aside class="db-filters">
			<section class="db-filter">
				<h2>國家</h2>
				<ul class="db-options" id="DbCountries"></ul>
			</section>
			<section class="db-filter" id="DbRegionFilter">
				<h2>地區</h2>
				<ul class="db-options" id="DbRegions"></ul>
			</section>
			<section class="db-filter" id="DbTypeFilter">
				<h2>鐵路種類</h2>
				<div id="DbTypes"></div>
			</section>
			<section class="db-filter" id="DbCompanyFilter">
				<h2>鐵路公司</h2>
				<div id="DbCompanies"></div>
			</section>
		</aside>

		<section>
			<input type="search" class="db-search" id="DbQuery" placeholder="搜尋路線、車站、公司" aria-label="搜尋路線、車站、公司" autocomplete="off" autofocus>
			<ul class="db-lines" id="DbLines"></ul>
			<p class="db-message db-hidden" id="DbMessage"></p>
			<div id="DbMore"></div>
		</section>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
	<script src="../../bootstrap/js/bootstrap.bundle.min.js"></script>
	<script src="../../program/ui/langSwitch.js"></script>
